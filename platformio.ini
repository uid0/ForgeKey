; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_extra_dirs = lib
extra_scripts = pre:scripts/build/version.py

[env:seeed_xiao_esp32s3]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
lib_deps =
    espressif/esp32-camera
    knolleary/PubSubClient
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
lib_extra_dirs = ${common.lib_extra_dirs}
build_src_filter =
    +<*>
    -<lock/>
    -<temperature/>
    -<capabilities/temperature_sensor/>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DFORGEKEY_BUILD_TARGET=\"seeed_xiao_esp32s3\"
    -DFORGEKEY_BUILD_FRAMEWORK=\"arduino\"
    -Isrc/camera
    -Isrc/detection
    -Isrc/counting
    -Isrc/mqtt
    -Isrc/provisioning
    -Isrc/photo_upload
    -Isrc/ota
    -Isrc/security
    -Isrc/config
    -Isrc/wifi_setup
    -Isrc/capabilities
    -Isrc/capabilities/ble_scanner
    -Isrc/capabilities/ble_beacon
    -Isrc/capabilities/ble_relay
    -Isrc/capabilities/ble_equipment
extra_scripts = ${common.extra_scripts}

; The active cabinet-lock firmware is the standalone ESP-IDF project under
; esp32c6-lock/. Build it from that directory with idf.py. The older Arduino
; prototype under src/lock/ is kept as a reference only and is excluded from
; the Arduino envs above.

; Temperature-sensor variant. Same firmware skeleton (provisioning, OTA,
; captive portal, MQTT, config rotation) but the camera/detection/photo
; pipeline is compiled out and a DHT 21 (AM2301) is sampled instead.
;
; Topic shape: forgekey/<mac>/temperature_sensor/reading
; Sensor kind in registration metadata: temperature-sensor
; Default DHT data pin: GPIO 2 (D1 on the XIAO ESP32-S3 header)
[env:seeed_xiao_esp32s3_temperature]
platform = ${common.platform}
board = seeed_xiao_esp32s3
framework = ${common.framework}
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    beegee-tokyo/DHT sensor library for ESPx@^1.19.0
lib_extra_dirs = ${common.lib_extra_dirs}
build_src_filter =
    +<*>
    -<lock/>
    -<camera/>
    -<detection/>
    -<counting/>
    -<photo_upload/>
    -<capabilities/people_counter/>
    -<capabilities/ble_scanner/>
    -<capabilities/ble_beacon/>
    -<capabilities/ble_relay/>
    -<capabilities/ble_equipment/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFORGEKEY_BUILD_TARGET=\"seeed_xiao_esp32s3_temperature\"
    -DFORGEKEY_BUILD_FRAMEWORK=\"arduino\"
    -DFORGEKEY_TEMPERATURE_SENSOR
    -DFORGEKEY_DISABLE_BLE_SCANNER
    -DFORGEKEY_DISABLE_BLE_BEACON
    -DFORGEKEY_DISABLE_BLE_RELAY
    -DFORGEKEY_DISABLE_BLE_EQUIPMENT
    -DFORGEKEY_SENSOR_KIND=\"temperature-sensor\"
    -DFORGEKEY_MQTT_TOPIC_KIND=\"temperature_sensor\"
    -Isrc/mqtt
    -Isrc/provisioning
    -Isrc/ota
    -Isrc/security
    -Isrc/config
    -Isrc/wifi_setup
    -Isrc/temperature
    -Isrc/capabilities
    -Isrc/capabilities/status_led
extra_scripts = ${common.extra_scripts}

; Seeed XIAO 7.5" ePaper Panel (SKU 6416) preventive-maintenance display.
; The device binds to one asset, wakes from deep sleep on a cadence,
; GETs a pre-rendered status PNG from OMS, flashes the panel, then
; sleeps again. No camera, no MQTT, and no remote OTA yet — HTTPS
; display-content polling only.
;
; OMS endpoints (see backend/forgekey/views.py::EPaperDisplayImageView):
;   GET  /api/forgekey/epaper/<display_id>/image.png  (supports If-None-Match)
;   POST /api/forgekey/epaper/<display_id>/battery/  {"percent": 0..100}
;
; The display_id is stored in NVS at provisioning time and is the
; same UUID the OMS admin shows when binding a panel to an asset.
;
; Hardware: Seeed XIAO 7.5" ePaper Panel (product page
; https://www.seeedstudio.com/XIAO-7-5-ePaper-Panel-p-6416.html).
; Panel resolution 800x480 monochrome, UC8179 driver IC. Ships with
; a Seeed XIAO ESP32-C3 (not S3); the driver board's XIAO socket is
; pin-compatible with any XIAO, but the C3 is what's in the box and
; what the cookbook targets, so this env builds for C3.
;
; Pin map (Seeed wiki — use Dx board-label macros, not raw GPIOs):
;     RST = D0  CS = D1   BUSY = D2  DC = D3
;     SCK = D8  MISO = D9 MOSI = D10
;
; Battery telemetry: the panel ships with a 2000 mAh LiPo + ETA9740E8A
; charger but does NOT route a voltage-divider line to the XIAO socket
; (verified against the Seeed schematic PDF). Charger LED1/LED2/LED3
; on the board surface are the only state indicator. The OMS battery
; endpoint stays declared but the firmware POSTs the placeholder value
; 100 — operators rely on the charger LEDs to flag a panel that needs
; the charged-twin swap.
[env:seeed_xiao_epaper]
platform = ${common.platform}
board = seeed_xiao_esp32c3
framework = ${common.framework}
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    https://github.com/Seeed-Studio/Seeed_Arduino_LCD.git
    bitbank2/PNGdec@^1.0.3
    ricmoo/QRCode@^0.0.1
lib_extra_dirs = ${common.lib_extra_dirs}
build_src_filter =
    +<*>
    -<lock/>
    -<camera/>
    -<detection/>
    -<counting/>
    -<photo_upload/>
    -<temperature/>
    -<capabilities/people_counter/>
    -<capabilities/temperature_sensor/>
    -<capabilities/ble_scanner/>
    -<capabilities/ble_beacon/>
    -<capabilities/ble_relay/>
    -<capabilities/ble_equipment/>
    -<capabilities/mmwave_presence/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFORGEKEY_BUILD_TARGET=\"seeed_xiao_epaper\"
    -DFORGEKEY_BUILD_FRAMEWORK=\"arduino\"
    -DFORGEKEY_EPAPER
    -DFORGEKEY_DISABLE_BLE_SCANNER
    -DFORGEKEY_DISABLE_BLE_BEACON
    -DFORGEKEY_DISABLE_BLE_RELAY
    -DFORGEKEY_DISABLE_BLE_EQUIPMENT
    -DFORGEKEY_SENSOR_KIND=\"epaper-display\"
    -DFORGEKEY_MQTT_TOPIC_KIND=\"epaper_display\"
    ; Seeed_GFX driver picks the panel + pin set from these defines.
    ; 502 = 7.5" mono UC8179; USE_XIAO_EPAPER_DRIVER_BOARD = the SKU
    ; 6416 driver board's XIAO socket pin map.
    -DBOARD_SCREEN_COMBO=502
    -DUSE_XIAO_EPAPER_DRIVER_BOARD
    -Isrc/mqtt
    -Isrc/provisioning
    -Isrc/ota
    -Isrc/security
    -Isrc/config
    -Isrc/wifi_setup
    -Isrc/capabilities
    -Isrc/capabilities/status_led
    -Isrc/capabilities/epaper_pm
extra_scripts = ${common.extra_scripts}
