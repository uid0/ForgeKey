; Seeed XIAO 7.5" ePaper Panel (SKU 6416) preventive-maintenance display.
; The device binds to one asset, wakes from deep sleep on a cadence,
; GETs a pre-rendered status PNG from OMS, flashes the panel, then
; sleeps again. No camera and no MQTT awake window; OTA, commands,
; cadence, health, and display-content all use display_id-keyed HTTPS polling.
;
; OMS endpoints (see backend/forgekey/views.py::EPaperDisplayImageView):
;   GET  /api/forgekey/epaper/<display_id>/firmware.json  (signed OTA spec)
;   GET  /api/forgekey/epaper/<display_id>/desired.json   (wake_min + commands)
;   GET  /api/forgekey/epaper/<display_id>/image.png      (supports If-None-Match)
;   POST /api/forgekey/epaper/<display_id>/health/        (render/wake/battery health)
;   POST /api/forgekey/epaper/<display_id>/command/status/
;
; The display_id is stored in NVS at provisioning time and is the
; same UUID the OMS admin shows when binding a panel to an asset.
;
; Hardware: Seeed XIAO 7.5" ePaper Panel (product page
; https://www.seeedstudio.com/XIAO-7-5-ePaper-Panel-p-6416.html).
; Panel resolution 800x480 monochrome, UC8179 driver IC. Ships with
; a Seeed XIAO ESP32-C3 (not S3); the driver board's XIAO socket is
; pin-compatible with any XIAO, but the C3 is what's in the box and
; what the cookbook targets, so this env builds for C3.
;
; Pin map (Seeed wiki — use Dx board-label macros, not raw GPIOs):
;     RST = D0  CS = D1   BUSY = D2  DC = D3
;     SCK = D8  MISO = D9 MOSI = D10
;
; Battery telemetry: the panel ships with a 2000 mAh LiPo + ETA9740E8A
; charger but does NOT route a voltage-divider line to the XIAO socket
; (verified against the Seeed schematic PDF). Charger LED1/LED2/LED3
; on the board surface are the stock indicator, and health reports
; power.battery.available=false. A field hardware mod can define
; FORGEKEY_BATTERY_ADC_PIN and divider calibration flags to report
; voltage/percent from an ADC-capable XIAO pin.
[env:seeed_xiao_epaper]
platform = ${common.platform}
board = seeed_xiao_esp32c3
framework = ${common.framework}
; The default Arduino-ESP32 partition table sizes app0/app1 at exactly
; 0x140000 (1280 KB). This firmware compiles to ~1.28 MB and overflows
; that slot by a few hundred bytes — esptool writes it anyway, the last
; segment spills into app1, and the bootloader's image verifier rejects
; it and calls `bootloader_reset()`. The arduino-esp32 prebuilt
; bootloader is built with log level NONE, so the failure shows up as a
; silent bootloop right after `entry 0x403cc710` with `Saved PC` pointed
; at the infinite-loop spin at the end of `bootloader_reset`.
; `min_spiffs.csv` keeps both OTA slots (this firmware OTA-updates from
; OMS) but grows each to 0x1E0000 (1920 KB), giving ~640 KB of headroom.
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    ; Pinned to the current master HEAD commit (fk-dvo). The bare URL resolved
    ; to master tip; a2de1ab is that exact commit, which is AHEAD of the latest
    ; tagged release V3.1.0 (0b13b21), so pinning the commit preserves the
    ; currently-building code with no functional change. Repo redirects to
    ; Seeed-Studio/Seeed_GFX.
    https://github.com/Seeed-Studio/Seeed_Arduino_LCD.git#a2de1abca0597c202193f22d01e9fa35d1ff613b
    bitbank2/PNGdec@^1.0.3
    ricmoo/QRCode@^0.0.1
lib_extra_dirs = ${common.lib_extra_dirs}
build_src_filter =
    +<*>
    -<lock/>
    -<capabilities/badge_reader/>
    -<camera/>
    -<detection/>
    -<counting/>
    -<photo_upload/>
    -<temperature/>
    -<capabilities/people_counter/>
    -<capabilities/temperature_sensor/>
    -<capabilities/ble_scanner/>
    -<capabilities/ble_beacon/>
    -<capabilities/ble_relay/>
    -<capabilities/ble_equipment/>
    -<capabilities/mmwave_presence/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFORGEKEY_BUILD_TARGET=\"seeed_xiao_epaper\"
    -DFORGEKEY_BUILD_FRAMEWORK=\"arduino\"
    -DFORGEKEY_EPAPER
    -DFORGEKEY_BATTERY_UNAVAILABLE_REASON=\"sku_6416_no_battery_adc_to_xiao_socket\"
    -DFORGEKEY_DISABLE_BLE_SCANNER
    -DFORGEKEY_DISABLE_BLE_BEACON
    -DFORGEKEY_DISABLE_BLE_RELAY
    -DFORGEKEY_DISABLE_BLE_EQUIPMENT
    -DFORGEKEY_SENSOR_KIND=\"epaper-display\"
    -DFORGEKEY_MQTT_TOPIC_KIND=\"epaper_display\"
    ; The Seeed_GFX ePaper stack intentionally emits #warning lines for
    ; unsupported touch/DMA paths on ESP32-C3; suppress those library notices
    ; and the matching ESP-IDF C3 attribute noise so CI/build logs surface
    ; actionable firmware warnings.
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wno-attributes
    ; Seeed_GFX driver picks the panel + pin set from these defines.
    ; 502 = 7.5" mono UC8179; USE_XIAO_EPAPER_DRIVER_BOARD = the SKU
    ; 6416 driver board's XIAO socket pin map.
    -DBOARD_SCREEN_COMBO=502
    -DUSE_XIAO_EPAPER_DRIVER_BOARD
    -Isrc/mqtt
    -Isrc/provisioning
    -Isrc/ota
    -Isrc/security
    -Isrc/config
    -Isrc/wifi_setup
    -Isrc/capabilities
    -Isrc/power
    -Isrc/capabilities/status_led
    -Isrc/capabilities/epaper_pm
extra_scripts = ${common.extra_scripts}

; Seeed Studio XIAO 2-Channel Wi-Fi AC Relay (SKU 114993526).
; Hardware uses a XIAO ESP32-C3, two latching relays, and BL0942 metering.
; ForgeKey controls the two relay outputs and reports aggregate BL0942 usage
; stats to OMS. Relay coils are pulsed (set/reset), not held.
; Default pin map follows Seeed's ESPHome reference firmware:
;   CH1 set GPIO5, CH1 reset GPIO4, CH2 set GPIO7, CH2 reset GPIO6.
; Metering defaults use the XIAO ESP32-C3 UART pins and can be overridden:
;   BL0942 UART RX GPIO20, TX GPIO21 at 2400 baud.
[env:seeed_xiao_esp32c3_2ch_relay]
platform = ${common.platform}
board = seeed_xiao_esp32c3
framework = ${common.framework}
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
lib_extra_dirs = ${common.lib_extra_dirs}
build_src_filter =
    +<*>
    -<lock/>
    -<capabilities/badge_reader/>
    -<camera/>
    -<detection/>
    -<counting/>
    -<photo_upload/>
    -<temperature/>
    -<capabilities/people_counter/>
    -<capabilities/temperature_sensor/>
    -<capabilities/ble_scanner/>
    -<capabilities/ble_beacon/>
    -<capabilities/ble_relay/>
    -<capabilities/ble_equipment/>
    -<capabilities/mmwave_presence/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DFORGEKEY_BUILD_TARGET=\"seeed_xiao_esp32c3_2ch_relay\"
    -DFORGEKEY_BUILD_FRAMEWORK=\"arduino\"
    -DFORGEKEY_POWER_RELAY
    -DFORGEKEY_DISABLE_BLE_SCANNER
    -DFORGEKEY_DISABLE_BLE_BEACON
    -DFORGEKEY_DISABLE_BLE_RELAY
    -DFORGEKEY_DISABLE_BLE_EQUIPMENT
    -DFORGEKEY_SENSOR_KIND=\"power-relay\"
    -DFORGEKEY_MQTT_TOPIC_KIND=\"power_relay\"
    -DFORGEKEY_POWER_RELAY_CH1_SET_PIN=5
    -DFORGEKEY_POWER_RELAY_CH1_RESET_PIN=4
    -DFORGEKEY_POWER_RELAY_CH2_SET_PIN=7
    -DFORGEKEY_POWER_RELAY_CH2_RESET_PIN=6
    -DFORGEKEY_POWER_RELAY_PULSE_MS=100
    -DFORGEKEY_POWER_RELAY_METER_ENABLED=1
    -DFORGEKEY_POWER_RELAY_METER_RX_PIN=20
    -DFORGEKEY_POWER_RELAY_METER_TX_PIN=21
    -DFORGEKEY_POWER_RELAY_METER_BAUD=2400
    -DFORGEKEY_POWER_RELAY_METER_LINE_FREQ_HZ=60
    -DFORGEKEY_POWER_RELAY_METER_SAMPLE_INTERVAL_MS=15000UL
    -DFORGEKEY_POWER_RELAY_USAGE_PUBLISH_INTERVAL_MS=60000UL
    -Isrc/mqtt
    -Isrc/provisioning
    -Isrc/ota
    -Isrc/security
    -Isrc/config
    -Isrc/wifi_setup
    -Isrc/capabilities
    -Isrc/power
    -Isrc/capabilities/status_led
    -Isrc/capabilities/power_relay
extra_scripts = ${common.extra_scripts}

[forgekey_production_security]
; Production profiles are manufacturing-only: they switch to an encrypted
; partition table, request ESP-IDF secure-boot/flash-encryption sdkconfig
; defaults where the PlatformIO Arduino package supports them, and compile the
; firmware so provisioning secrets are opened from encrypted NVS.
board_build.partitions = partitions/forgekey_secure_ota.csv
board_build.sdkconfig = sdkconfig.forgekey-production.defaults
build_flags =
    -DFORGEKEY_PRODUCTION_SECURITY
    -DFORGEKEY_SECURE_NVS_PARTITION=\"nvs\"

; The camera + TFLite people-counter image is ~2.24 MB and does not fit the
; 1.5 MB OTA slot in the shared 4 MB secure table, so this env — and only this
; env — uses the 8 MB variant with 3 MB slots. The XIAO ESP32-S3 has 8 MB of
; flash, so nothing is lost; the 4 MB table exists because the ESP32-C3 prod
; targets have only 4 MB. Without this the image overflows its slot, which is
; both a build failure and a secure-OTA blocker for this device type.
; The other S3 prod envs stay on the 4 MB table: they fit it comfortably
; (75-77% used) and moving them would change the flash layout of images that
; already build and flash correctly.
[env:seeed_xiao_esp32s3_prod]
extends = env:seeed_xiao_esp32s3, forgekey_production_security
board_build.partitions = partitions/forgekey_secure_ota_8mb.csv
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    ${forgekey_production_security.build_flags}

[env:seeed_xiao_esp32s3_temperature_prod]
extends = env:seeed_xiao_esp32s3_temperature, forgekey_production_security
build_flags =
    ${env:seeed_xiao_esp32s3_temperature.build_flags}
    ${forgekey_production_security.build_flags}

[env:seeed_xiao_esp32s3_asset_indicator_prod]
extends = env:seeed_xiao_esp32s3_asset_indicator, forgekey_production_security
build_flags =
    ${env:seeed_xiao_esp32s3_asset_indicator.build_flags}
    ${forgekey_production_security.build_flags}

[env:seeed_xiao_epaper_prod]
extends = env:seeed_xiao_epaper, forgekey_production_security
build_flags =
    ${env:seeed_xiao_epaper.build_flags}
    ${forgekey_production_security.build_flags}

[env:seeed_xiao_esp32c3_2ch_relay_prod]
extends = env:seeed_xiao_esp32c3_2ch_relay, forgekey_production_security
build_flags =
    ${env:seeed_xiao_esp32c3_2ch_relay.build_flags}
    ${forgekey_production_security.build_flags}

; Access-control credential reader. SENSOR ONLY: reads an RFID/NFC credential
; and publishes forgekey.access_request.v1 to OMS on forgekey/<mac>/access/request;
; OMS authorizes and drives the relay/lock/indicator over the existing command
; channel (no local allow/deny on the device). See docs/contracts/mqtt.md.
;
; Two flavours:
;   *_badge_reader       PN532-over-I2C reference hardware driver (Adafruit PN532).
;   *_badge_reader_mock  synthetic-UID mock driver, no hardware — exercises the
;                        full poll->debounce->publish pipeline in CI / on a bare
;                        dev board. A serial line forces an immediate scan.
;
; Reference reader hardware is TBD (Ian to confirm). PN532 is the documented
; default; swapping to RC522/Wiegand/etc. touches only the driver TU
; (src/capabilities/badge_reader/badge_reader_*.cpp), not the capability,
; the MQTT contract, or OMS. The PN532 library dep is in the hardware env only.
[env:seeed_xiao_esp32s3_badge_reader]
platform = ${common.platform}
board = seeed_xiao_esp32s3
framework = ${common.framework}
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit PN532@^1.3.3
lib_extra_dirs = ${common.lib_extra_dirs}
build_src_filter =
    +<*>
    -<lock/>
    -<camera/>
    -<detection/>
    -<counting/>
    -<photo_upload/>
    -<temperature/>
    -<capabilities/people_counter/>
    -<capabilities/temperature_sensor/>
    -<capabilities/ble_scanner/>
    -<capabilities/ble_beacon/>
    -<capabilities/ble_relay/>
    -<capabilities/ble_equipment/>
    -<capabilities/mmwave_presence/>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFORGEKEY_BUILD_TARGET=\"seeed_xiao_esp32s3_badge_reader\"
    -DFORGEKEY_BUILD_FRAMEWORK=\"arduino\"
    -DFORGEKEY_BADGE_READER
    -DFORGEKEY_BADGE_READER_PN532
    -DFORGEKEY_DISABLE_BLE_SCANNER
    -DFORGEKEY_DISABLE_BLE_BEACON
    -DFORGEKEY_DISABLE_BLE_RELAY
    -DFORGEKEY_DISABLE_BLE_EQUIPMENT
    -DFORGEKEY_SENSOR_KIND=\"badge-reader\"
    -DFORGEKEY_MQTT_TOPIC_KIND=\"badge_reader\"
    -DFORGEKEY_BADGE_READER_I2C_SDA=5
    -DFORGEKEY_BADGE_READER_I2C_SCL=6
    -DFORGEKEY_BADGE_READER_PN532_IRQ=8
    -DFORGEKEY_BADGE_READER_PN532_RESET=9
    -Isrc/mqtt
    -Isrc/provisioning
    -Isrc/ota
    -Isrc/security
    -Isrc/config
    -Isrc/wifi_setup
    -Isrc/capabilities
    -Isrc/power
    -Isrc/capabilities/status_led
    -Isrc/capabilities/badge_reader
extra_scripts = ${common.extra_scripts}

[env:seeed_xiao_esp32s3_badge_reader_mock]
platform = ${common.platform}
board = seeed_xiao_esp32s3
framework = ${common.framework}
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
lib_extra_dirs = ${common.lib_extra_dirs}
