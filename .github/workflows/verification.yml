name: Verification Ladder

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  host-tests:
    name: Host contract and simulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run host and simulator tests
        run: python -m pytest -m "not hil"

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema registry
        run: python scripts/validate_schemas.py

  docs-links:
    name: Documentation link checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local Markdown links
        run: python scripts/check_docs_links.py

  platformio-build:
    name: PlatformIO firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build PlatformIO environments
        run: pio run

  esp-idf-lock-build:
    name: ESP-IDF cabinet-lock build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ESP32-C6 lock firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32c6
          path: esp32c6-lock
          command: idf.py build
